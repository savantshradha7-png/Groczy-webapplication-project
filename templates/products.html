{% extends 'base.html' %}{% block title %}Shop groceries | Groczy{% endblock %}{% block content %}<div class="container section-pad"><div class="section-heading"><div><span class="eyebrow">THE GROCZY MARKET</span><h1>Shop groceries</h1><p class="text-secondary">Good ingredients, easy to find.</p></div></div><div class="filters"><label>Category<select id="category"><option value="">All categories</option>{% for c in categories %}<option value="{{ c.slug }}">{{ c.name }}</option>{% endfor %}</select></label><label>Brand<input id="brand" placeholder="Any brand"></label><label>Min ₹<input id="min" type="number" min="0"></label><label>Max ₹<input id="max" type="number" min="0"></label><label>Sort<select id="sort"><option value="newest">Newest</option><option value="popular">Popularity</option><option value="price_asc">Price: low to high</option><option value="price_desc">Price: high to low</option><option value="name">Name</option></select></label><label class="check-filter"><input type="checkbox" id="available"> In stock</label><button class="btn btn-outline-secondary" id="clear-filters">Clear filters</button></div><div id="catalog-grid" class="product-grid"><div class="loading"><span class="spinner-border text-success"></span> Loading fresh picks…</div></div><div id="pagination" class="pagination-row"></div></div>{% endblock %}{% block scripts %}<script src="{{ url_for('static',filename='js/catalog.js') }}"></script><script>initCatalog({{ request.args.get('q','')|tojson }},{{ request.args.get('category','')|tojson }})</script>{% endblock %}
