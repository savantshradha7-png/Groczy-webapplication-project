{% extends 'base.html' %}{% block content %}<div class="container section-pad"><span class="eyebrow">ALMOST THERE</span><h1>Checkout</h1><div class="checkout-layout"><form id="checkout-form" class="panel"><label>Delivery address<textarea name="address" required minlength="8" rows="4"></textarea></label><label>Contact number<input name="phone" required minlength="7"></label><fieldset><legend>Payment method</legend><label class="payment-option"><input type="radio" name="payment" value="cod" checked> Cash on Delivery <span class="text-secondary">— order is unpaid until collected</span></label><label class="payment-option"><input type="radio" name="payment" value="online"> Online payment</label><p class="small text-secondary">Online payment is currently disabled in this demonstration project. No money will be charged.</p></fieldset><button class="btn btn-success btn-lg">Place COD order</button><div id="checkout-message" role="status"></div></form><div class="panel"><h2>Order summary</h2><div id="checkout-summary">Loading cart…</div></div></div></div>{% endblock %}{% block scripts %}<script src="{{ url_for('static',filename='js/customer.js') }}"></script><script>loadCheckout()</script>{% endblock %}
