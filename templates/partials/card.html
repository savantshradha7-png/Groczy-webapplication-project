<article class="product-card"><a class="product-image" href="/product/{{ p.id }}"><img src="{{ p.image_url or 'https://placehold.co/600x450/e8f5e9/198754?text=Fresh+Grocery' }}" alt="{{ p.name }}" loading="lazy" onerror="this.src='https://placehold.co/600x450/e8f5e9/198754?text=Fresh+Grocery'"></a><button class="wish-icon" aria-label="Add {{ p.name }} to wishlist" onclick="wishlistAdd({{ p.id }})"><i class="fa-regular fa-heart"></i></button>{% if p.discount_percent %}<span class="discount-tag">-{{ p.discount_percent|int }}%</span>{% endif %}<div class="product-info"><small>{{ p.brand or p.category.name }}</small><a href="/product/{{ p.id }}"><h3>{{ p.name }}</h3></a><span class="pack">{{ p.pack_size }}</span><div class="price-line">{% if p.discount_percent %}<del>₹{{ '%.2f'|format(p.price) }}</del>{% endif %}<strong>₹{{ '%.2f'|format(p.final_price) }}</strong></div><div class="card-actions"><button class="btn btn-success" {% if not p.stock %}disabled{% endif %} onclick="addToCart({{ p.id }})">{% if p.stock %}<i class="fa-solid fa-plus"></i> Add{% else %}Out of stock{% endif %}</button><a href="/product/{{ p.id }}" class="details-link">Details</a></div></div></article>
